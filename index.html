<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dribbble Bootstrap Mockup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container py-3">


    <header class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">

      <div class="d-flex align-items-center gap-3">
        <img src="avatar.jpg" alt="Profile avatar" class="rounded-circle" width="55" height="55">

        <div class="d-flex align-items-center gap-2">
          <strong>ALEX BENDER for FANCY</strong>
          <span class="text-success">Available for work</span>
          <a href="#" class="text-secondary text-decoration-none">Follow</a>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light rounded-circle border">♡</button>
        <button class="btn btn-light rounded-circle border">⌑</button>
        <button class="btn btn-dark rounded-pill px-4">Get in touch</button>
      </div>

    </header>

 
    <main class="text-center">
      <img src="ai-page.jpg" alt="AI agents landing page design" class="img-fluid rounded-3 shadow-sm">
    </main>

  </div>

</body>
</html>
